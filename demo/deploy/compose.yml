# One command brings up all three layers on the server:  docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/todo
      DB_USER: todo
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
